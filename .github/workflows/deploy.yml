name: deploy

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: [main, dev]
  pull_request:
    branches: [ main, dev ]
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "deploy"
  unit-test-pytest:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository so your job can access it
      - name: Check-out repository
        uses: actions/checkout@v2
    
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13" 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[tests]

      # Download nltk wordnet (same as CI so tests don't fail)
      - name: Download nltk wordnet
        run: |
          python -m nltk.downloader wordnet omw-1.4

      # Run pytest with coverage
      - name: Run tests with coverage
        run: |
          pytest --cov --cov-report=term --cov-branch

      # Run style checker - ruff
      - name: Run tests with coverage
        run: |
          ruff check .

  pypi-test:
    needs: unit-test-pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check-out repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install hatch
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Build package
        run: hatch build

      # Publish to TestPyPI
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      # Test install from TestPyPI 
      - name: Verify install from TestPyPI
        run: |
          python -m pip uninstall -y you_need_a_dictionary || true
          python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple you_need_a_dictionary
          python -c "import you_need_a_dictionary; print('Installed OK')"


